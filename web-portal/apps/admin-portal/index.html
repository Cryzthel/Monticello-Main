<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monticello Villas | Admin Portal</title>

    <!--
      Inter (UI) + JetBrains Mono (machine data) + Plus Jakarta Sans (display).
      See the --font-sans / --font-mono / --font-display tokens in the shared
      stylesheet for which text gets which.

      Plus Jakarta Sans is requested HERE AND NOT IN THE GUARDHOUSE, at only
      the two weights the sign-in heading uses (700, 800). It is a display
      face for one heading on one screen in this console; asking the other
      console to download it would be paying for a face it never renders. The
      token's fallback chain starts with Inter, so a guardhouse that ever
      adopts that shell degrades to the body face rather than to Times.
      Both apps must request the SAME families — the token lives in the shared
      sheet, so a portal that asks Google for a different face here renders the
      other portal's fallback and the two consoles drift apart silently.

      preconnect to BOTH hosts matters: the stylesheet comes from
      fonts.googleapis.com but the font files themselves come from
      fonts.gstatic.com, and without the second hint that connection is only
      opened after the CSS has parsed — which is exactly the critical path you
      are trying to shorten. crossorigin is required on the gstatic hint
      because font fetches are CORS requests; without it the browser opens a
      second, unusable connection.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Chillax is the wordmark's FALLBACK now, not its face.

      The brand face is Affinik, which is a licensed retail font with no CDN
      behind it, so it is self-hosted instead — see the @font-face at the top
      of the shared stylesheet. `--font-brand` lists Affinik first and Chillax
      behind it, which is why this <link> is still here: until the licence
      file is committed to apps/*/public/fonts/, Chillax is what the wordmark
      ACTUALLY renders in, and dropping this early would degrade the lockup to
      Inter.

      So: once that file lands, DELETE this stylesheet link and the two
      Fontshare preconnects below it. A render-blocking stylesheet plus a font
      download that nothing uses any more is pure cost on every cold load.
      apps/*/public/fonts/README.md says the same thing next to the file.

      Fontshare needs its own pair of hints while it is here — the stylesheet
      is served by api.fontshare.com and the font files by cdn.fontshare.com.
      Same reasoning as the Google pair above: without the second hint that
      connection is only opened after this CSS has parsed.

      Requested in BOTH consoles, unlike Plus Jakarta Sans. That exception
      holds for a face used by one heading on one screen; this one dresses the
      brand wordmark in the shared sidebar and the shared sign-in header, so
      both portals render it and both must ask for it.

      ONE WEIGHT. The wordmark sets 600 and nothing else does.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f%5B%5D=chillax@600&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
    />
    <!--
      Theme resolution BEFORE first paint.

      This has to be a blocking inline script in <head>, not React: by the time
      ThemeProvider mounts, the browser has already painted at least one frame,
      and for a light-mode user that frame is the full dark canvas. The flash
      is brief and genuinely unpleasant.

      Duplicated logic with ThemeProvider is the accepted cost of that — the
      storage key and the class names are the contract between the two. Keep
      them in sync with packages/shared/src/theme/ThemeProvider.jsx.

      The key is deliberately NOT portal-namespaced. Theme is a device
      preference carrying no session identity, so it has no reason to be scoped
      to a portal. Note that the two consoles no longer SHARE it either — they
      are separate origins, and localStorage is per-origin — so each console
      remembers the choice independently. The un-namespaced key is what keeps
      that from changing if the two are ever co-hosted on one origin.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('monticello-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
          // The sign-in screen is pinned light regardless of preference —
          // see useForcedTheme in packages/shared/src/theme/ThemeProvider.jsx,
          // which is the runtime half of this. Resolving it here as well is
          // what stops a dark-mode administrator seeing one full dark frame of
          // the login card on a cold load or a refresh; React cannot help,
          // because by the time it mounts that frame has already been painted.
          if (location.pathname === '/login') theme = 'light'
          var root = document.documentElement
          root.classList.remove('light', 'dark')
          root.classList.add(theme)
          // Makes native scrollbars, form controls and the <input type="date">
          // picker match the theme instead of always rendering light chrome.
          root.style.colorScheme = theme
        } catch (e) {
          /* Private mode / blocked storage — the `light` class on <html> stands. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
