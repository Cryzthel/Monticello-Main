org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# THIS MACHINE NEEDS `TEMP`/`TMP` POINTED SOMEWHERE OTHER THAN %LOCALAPPDATA%\Temp
#
# Gradle failed before running a single task with:
#     java.io.IOException: Unable to establish loopback connection
# from Selector.open() -> WEPollSelectorImpl -> PipeImpl, whose LoopbackConnector
# opens an AF_UNIX socket in the temp directory Windows reports natively. McAfee
# (installed alongside Defender) allows bind() there but blocks connect().
# Measured: AF_UNIX bind OK / connect "Invalid argument: connect" under %TEMP%,
# both OK under any directory outside it; TCP loopback is fine throughout.
#
# It is NOT a JDK-version problem (21 and 25 fail identically) and NOT a Gradle
# one (every Gradle version opens a selector). The fix is environmental:
#     $env:TEMP="C:\gradle-tmp"; $env:TMP="C:\gradle-tmp"
# which the daemon inherits. It CANNOT live in this file: a `-Djdk.net.unixdomain
# .tmpdir=...` added to org.gradle.jvmargs above is silently dropped, because
# Gradle strips -D properties out of jvmargs and applies them as build
# properties — verified by reading `daemonOpts` back out of a failing run, where
# it was absent. `java.io.tmpdir` does not work either; the JDK resolves the
# AF_UNIX directory from the native TEMP, not that property.

# Gradle 8.14 (April 2025) predates JDK 25 and does not support it. Android
# Studio's bundled JBR is 25.0.2 and JAVA_HOME is unset, so Gradle defaulted to
# it. Pinned to Temurin 21 LTS. (This is a supportability fix, not the fix for
# the loopback failure above — JDK 21 hit that identically until TEMP moved.)
org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-21.0.12.8-hotspot
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
